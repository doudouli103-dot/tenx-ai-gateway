services:
  tenx-ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: tenx-ai-gateway:latest
    container_name: tenx-ai-gateway
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      TENX_AI_GATEWAY_API_KEYS: ${TENX_AI_GATEWAY_API_KEYS:-local-dev-key}
      TENX_LOCAL_OPENAI_BASE_URL: ${TENX_LOCAL_OPENAI_BASE_URL:-http://host.docker.internal:4000}
      TENX_LOCAL_OPENAI_API_KEY: ${TENX_LOCAL_OPENAI_API_KEY:-}
      TENX_IMAGE_OPENAI_BASE_URL: ${TENX_IMAGE_OPENAI_BASE_URL:-http://host.docker.internal:4010}
      TENX_IMAGE_OPENAI_API_KEY: ${TENX_IMAGE_OPENAI_API_KEY:-}
      TENX_VIDEO_OPENAI_BASE_URL: ${TENX_VIDEO_OPENAI_BASE_URL:-http://host.docker.internal:4020}
      TENX_VIDEO_OPENAI_API_KEY: ${TENX_VIDEO_OPENAI_API_KEY:-}
      TENX_CLOUD_OPENAI_BASE_URL: ${TENX_CLOUD_OPENAI_BASE_URL:-https://api.openai.com}
      TENX_CLOUD_OPENAI_API_KEY: ${TENX_CLOUD_OPENAI_API_KEY:-}
      TENX_DOCUMENT_CENTER_BASE_URL: ${TENX_DOCUMENT_CENTER_BASE_URL:-http://host.docker.internal:9000}
      TENX_DOCUMENT_CENTER_UPLOAD_PATH: ${TENX_DOCUMENT_CENTER_UPLOAD_PATH:-/api/files}
    extra_hosts:
      - "host.docker.internal:host-gateway"
