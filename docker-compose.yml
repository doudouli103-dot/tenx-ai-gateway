services:
  tenx-ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: tenx-ai-gateway:latest
    container_name: tenx-ai-gateway
    restart: unless-stopped
    logging:
      driver: "none"
    ports:
      - "8088:8088"
    volumes:
      - type: bind
        source: /Volumes/LJW/tenx-ai/comfyui/output
        target: /data/comfy-output
        read_only: true
        bind:
          create_host_path: false
    environment:
      TENX_AI_GATEWAY_API_KEYS: ${TENX_AI_GATEWAY_API_KEYS:-local-dev-key}
      TENX_AI_GATEWAY_ADMIN_ENABLED: ${TENX_AI_GATEWAY_ADMIN_ENABLED:-true}
      TENX_AI_GATEWAY_ADMIN_COMMAND_TIMEOUT_MILLIS: ${TENX_AI_GATEWAY_ADMIN_COMMAND_TIMEOUT_MILLIS:-60000}
      TENX_AI_GATEWAY_ADMIN_COMMAND_SHELL: ${TENX_AI_GATEWAY_ADMIN_COMMAND_SHELL:-/bin/sh}
      TENX_AI_GATEWAY_ADMIN_CORS_ALLOWED_ORIGINS: ${TENX_AI_GATEWAY_ADMIN_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      TENX_AI_GATEWAY_HTTP_MAX_CONNECTIONS: ${TENX_AI_GATEWAY_HTTP_MAX_CONNECTIONS:-200}
      TENX_AI_GATEWAY_HTTP_PENDING_ACQUIRE_TIMEOUT_MILLIS: ${TENX_AI_GATEWAY_HTTP_PENDING_ACQUIRE_TIMEOUT_MILLIS:-30000}
      TENX_AI_GATEWAY_HTTP_CONNECT_TIMEOUT_MILLIS: ${TENX_AI_GATEWAY_HTTP_CONNECT_TIMEOUT_MILLIS:-5000}
      TENX_AI_GATEWAY_HTTP_RESPONSE_TIMEOUT_MILLIS: ${TENX_AI_GATEWAY_HTTP_RESPONSE_TIMEOUT_MILLIS:-120000}
      TENX_AI_GATEWAY_HTTP_READ_TIMEOUT_MILLIS: ${TENX_AI_GATEWAY_HTTP_READ_TIMEOUT_MILLIS:-120000}
      TENX_AI_GATEWAY_HTTP_WRITE_TIMEOUT_MILLIS: ${TENX_AI_GATEWAY_HTTP_WRITE_TIMEOUT_MILLIS:-120000}
      TENX_AI_GATEWAY_HTTP_MAX_IN_MEMORY_SIZE_BYTES: ${TENX_AI_GATEWAY_HTTP_MAX_IN_MEMORY_SIZE_BYTES:-16777216}
      TENX_LOCAL_OPENAI_BASE_URL: ${TENX_LOCAL_OPENAI_BASE_URL:-http://host.docker.internal:4000}
      TENX_LOCAL_OPENAI_API_KEY: ${TENX_LOCAL_OPENAI_API_KEY:-}
      TENX_COMFYUI_BASE_URL: ${TENX_COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      TENX_COMFYUI_RESULTS_DIRECTORY: /data/comfy-output
      TENX_IMAGE_PUBLIC_BASE_URL: ${TENX_IMAGE_PUBLIC_BASE_URL:-http://lijunweideMac-Studio.local:8088}
      TENX_COMFYUI_POLL_INTERVAL_MILLIS: ${TENX_COMFYUI_POLL_INTERVAL_MILLIS:-2000}
      TENX_COMFYUI_GENERATION_TIMEOUT_MILLIS: ${TENX_COMFYUI_GENERATION_TIMEOUT_MILLIS:-600000}
      TENX_COMFYUI_VIDEO_GENERATION_TIMEOUT_MILLIS: ${TENX_COMFYUI_VIDEO_GENERATION_TIMEOUT_MILLIS:-1800000}
      TENX_COMFYUI_MAX_CONCURRENT_GENERATIONS: ${TENX_COMFYUI_MAX_CONCURRENT_GENERATIONS:-1}
      TENX_COMFYUI_RESPONSE_TIMEOUT_MILLIS: ${TENX_COMFYUI_RESPONSE_TIMEOUT_MILLIS:-600000}
      TENX_COMFYUI_READ_TIMEOUT_MILLIS: ${TENX_COMFYUI_READ_TIMEOUT_MILLIS:-600000}
      TENX_COMFYUI_VIDEO_RESPONSE_TIMEOUT_MILLIS: ${TENX_COMFYUI_VIDEO_RESPONSE_TIMEOUT_MILLIS:-1800000}
      TENX_COMFYUI_VIDEO_READ_TIMEOUT_MILLIS: ${TENX_COMFYUI_VIDEO_READ_TIMEOUT_MILLIS:-1800000}
      TENX_CLOUD_OPENAI_BASE_URL: ${TENX_CLOUD_OPENAI_BASE_URL:-https://api.openai.com}
      TENX_CLOUD_OPENAI_API_KEY: ${TENX_CLOUD_OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
